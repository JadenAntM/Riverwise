services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: riverwise
      POSTGRES_USER: riverwise
      POSTGRES_PASSWORD: riverwise
    ports:
      - "5432:5432"
    volumes:
      - riverwise_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riverwise -d riverwise"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://riverwise:riverwise@db:5432/riverwise
      API_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://riverwise:riverwise@db:5432/riverwise
    command: ["python", "/workspace/jobs/ingest/scheduler.py"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  ingest:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://riverwise:riverwise@db:5432/riverwise
    command: ["python", "/workspace/jobs/ingest/ingest.py", "--source", "fixtures", "--evaluation-time", "2026-09-23T16:30:00Z"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  riverwise_postgres:
